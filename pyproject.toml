[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webaudit"
version = "0.1.0"
description = "Authenticated Web Security Auditor: passive, local-first, evidence-based."
requires-python = ">=3.11"
dependencies = [
  "playwright==1.54.0",
  "pydantic==2.10.4",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.3.0",
  "aiohttp==3.13.2",
]
rich = ["rich==15.0.0"]

[project.scripts]
webaudit = "webaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["browser: needs a real Chromium"]
